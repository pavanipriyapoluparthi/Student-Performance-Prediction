<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 95%;
            min-height: 520px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .left {
            width: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 60px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .left h1 span {
            color: #ffe082;
        }

        .left p {
            font-size: 17px;
            line-height: 1.7;
            opacity: 0.95;
        }

        .features {
            margin-top: 25px;
        }

        .features p {
            margin: 12px 0;
            font-size: 15px;
        }

        .right {
            width: 50%;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            color: #333;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #444;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #5568d9;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #777;
        }

        .register a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            background: #ffe5e5;
            color: #d63031;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 35px;
            }

            .right {
                padding: 35px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <h1>
            Student <span>Performance</span> Prediction
        </h1>

      

        
    </div>


    <!-- Right Side -->

    <div class="right">

        <h2>Welcome Back 👋</h2>

        <p class="subtitle">
            Login to your account
        </p>

        {% if message %}
        <div class="message">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="/register">
                Register here
            </a>

        </div>

    </div>

</div>

</body>
</html>
